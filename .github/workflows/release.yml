name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # GoReleaser needs write access to create the GitHub Release and upload assets.
  contents: write

# Security posture: this job HOLDS THE macOS SIGNING SECRETS (Developer ID cert
# + App Store Connect notary key). So it is hardened against supply-chain risk:
#
#   * Every third-party action is pinned to an immutable commit SHA (a tag like
#     @v7 is mutable and could be repointed at malicious code).
#   * Both the Go toolchain and GoReleaser are installed by fail-CLOSED
#     downloads: we fetch the exact tarball and verify its SHA-256 before it
#     runs. We deliberately do NOT use actions/setup-go (resolves from a
#     mutable version manifest with no digest pin) or goreleaser-action (its
#     checksum verification is fail-OPEN — it proceeds if verification can't be
#     done) — both unacceptable for a secret-holding job. GOTOOLCHAIN=local
#     also stops Go from transparently fetching a different toolchain at build.
#
# Signing runs on ubuntu-latest because GoReleaser's quill notarize backend is
# pure Go and keychain-free (no macOS runner needed).
#
# To bump GoReleaser: pick the new version, take goreleaser_Linux_x86_64.tar.gz's
# digest from that release's checksums.txt (cross-check it against the release
# page), and update both GORELEASER_VERSION and GORELEASER_SHA256 below.
env:
  GORELEASER_VERSION: v2.17.1
  GORELEASER_SHA256: a99bbc7ae0d8d897b07c4c497a9b62f222558804715ef219d1af05a7e417bc80
  # Go toolchain: installed below with the same fail-closed digest check
  # (setup-go resolves from a mutable manifest without one, and goreleaser
  # launches the compiler inside the secret-bearing Release step). Must
  # satisfy go.mod's `go` directive; GOTOOLCHAIN=local forbids Go from
  # transparently downloading a different toolchain. Update both values
  # together from https://go.dev/dl/ (digest published there; cross-check
  # by hashing an independently downloaded tarball).
  GO_VERSION: 1.26.7
  GO_SHA256: ffb5f8de10c62550dfddab66b36b57030721e0a44a3218e9e1181d7b59f121ca
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The five MACOS_* signing secrets live in the 'release' environment,
    # not as repository secrets: environment secrets are withheld until the
    # environment's protection rules pass (required reviewer + v* tag rule),
    # so a rogue workflow on another ref — or a pushed v* tag that nobody
    # approves — never sees them. Each release run pauses in the Actions UI
    # until the reviewer approves.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so GoReleaser can build the changelog from tags.
          fetch-depth: 0

      - name: Install Go (digest-verified, fail-closed)
        run: |
          curl -fsSLo "$RUNNER_TEMP/go.tgz" \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - name: Install goreleaser (digest-verified, fail-closed)
        run: |
          curl -fsSLo "$RUNNER_TEMP/goreleaser.tgz" \
            "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz"
          echo "${GORELEASER_SHA256}  $RUNNER_TEMP/goreleaser.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/goreleaser-bin"
          tar -xzf "$RUNNER_TEMP/goreleaser.tgz" -C "$RUNNER_TEMP/goreleaser-bin" goreleaser

      # The ONLY step that sees the signing secrets. If the five MACOS_* secrets
      # are unset (e.g. a fork), the notarize block skips and darwin ships
      # unsigned — the release still succeeds.
      - name: Release
        run: '"$RUNNER_TEMP/goreleaser-bin/goreleaser" release --clean'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
